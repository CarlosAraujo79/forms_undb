<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Obrigado pelo envio!</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f9f7fc;
      text-align: center;
      padding: 50px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: inline-block;
      max-width: 800px;
    }

    h1, h2, p {
      color: #333;
    }

    .galeria {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .galeria img {
      width: 320px;
      height: 200px;
      object-fit: cover; /* garante corte proporcional */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Obrigado por preencher o formulário!</h1>
    <p>Seu envio foi registrado com sucesso. Agradecemos a sua participação!</p>
    <hr>
    <h2>Sobre nossa campanha</h2>
    <p>📞 (98) 99999-9999</p>
    <p>📍 Av. Coronel Colares Moreira, 443A - Jardim Renascença, São Luís - MA, 65075-441</p>
    <div class="galeria">
      <img src="campanha1.png" alt="Campanha 1">
      <img src="campanha2.png" alt="Campanha 2">
    </div>
  </div>
</body>
</html>
